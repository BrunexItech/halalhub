services:
  db:
    image: postgres:15-alpine
    container_name: halalhub_db
    environment:
      POSTGRES_USER: halalhub_user
      POSTGRES_PASSWORD: halalhub123
      POSTGRES_DB: halalhub
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    networks:
      - halalhub_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U halalhub_user"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: halalhub_backend
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - DB_HOST=db
      - DB_PORT=5432
      - LIVEKIT_URL=ws://halalhub_livekit:7880
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
      livekit:
        condition: service_started
    networks:
      - halalhub_network
    volumes:
      - ./backend:/app
      - /app/node_modules
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_LIVEKIT_URL: ${VITE_LIVEKIT_URL}
    container_name: halalhub_frontend
    ports:
      - "9999:80"
    depends_on:
      - backend
    networks:
      - halalhub_network
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server
    container_name: halalhub_livekit
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    environment:
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=secret
    command: --dev --bind 0.0.0.0
    networks:
      - halalhub_network
    restart: unless-stopped

networks:
  halalhub_network:
    driver: bridge

volumes:
  postgres_data: